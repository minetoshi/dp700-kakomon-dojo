れか。同一ID内の時刻は一意とする。", "options": [["1", "全体の最大1行ではなくIDごとの最大行である。"], ["0", "行をすべて除外する条件は無い。"], ["2", "IDごとに最新行を選ぶためC1とC2の2行になる。"], ["3", "元イベント数と最新化後のID数を混同している。"]], "code": "Events | summarize arg_max(EventTime, *) by ContractId", "answer": "C", "number": 11, "id": "M2-11"}, {"exam": 2, "k": "K03", "stem": "Git同期の後に接続エラーが出た。対応Itemの定義は一致している。適切な判断はどれか。", "options": [["Git履歴を削除すれば解決する", "エラー原因を調べず履歴を失う不適切な対応である。"], ["定義一致なら接続先も必ず正しい", "本番用接続の確認を省略している。"], ["環境ごとの接続・資格情報・権限を検証する", "定義の一致と実行可能性は別の検証である。"], ["データ全量もGitから復元済みと見なす", "定義管理とデータの移行を混同している。"]], "code": "", "answer": "C", "number": 12, "id": "M2-12"}, {"exam": 2, "k": "K06", "stem": "Analystは以下のGRANT以外に広いSELECTを持たない。SQLでSELECT ContractID, Premiumは成功し、SELECT *は失敗する。最も適切な説明はどれか。", "options": [["SQL RLSが全列を自動削除した", "RLSは行条件であり列許可と異なる。"], ["Dynamic data maskingなら必ずSELECT *が失敗する", "Maskは値の表示であり列参照禁止と同一ではない。"], ["SQLエンジンは列単位のGRANTに対応しない", "製品の列権限の機能と矛盾する。"], ["列の許可に含まれない列をSELECT *が参照した", "CLSの条件に合う。"]], "code": "GRANT SELECT ON dbo.Contracts(ContractID, Premium) TO Analyst;", "answer": "D", "number": 13, "id": "M2-13"}, {"exam": 2, "k": "K20", "stem": "入力に新しい列が増えてDelta書込が不一致になった。列追加は正当で下流も対応済み。最も適切な方向はどれか。", "options": [["原因に関係なくoverwriteSchemaを常用", "表定義全体への影響を不必要に広げる。"], ["VACUUMで列を追加", "ファイル保持の整理はスキーマ追加を行わない。"], ["すべての型違いも無条件で自動修復すると見なす", "列追加と任意の型変更は同じではない。"], ["対応するmergeSchema等で必要な列追加を許可", "意味と影響を確認したうえで拡張する。"]], "code": "", "answer": "D", "number": 14, "id": "M2-14"}, {"exam": 2, "k": "K28", "stem": "Eventhouseで.show ingestion failuresが空だった。データが無い原因を取り込み失敗以外に断定してよいか。", "options": [["断定せず取り込みメトリック・診断ログ等も確認する", "コマンドは全段階の失敗を網羅しない。"], ["空なら必ずソース未送信", "入力・変換・権限等の調査を省いている。"], ["空なら全方式の取り込みは必ず成功", "コマンドの対象範囲を過大評価している。"], ["空なら必ずSQL RLSが原因", "他の可能性を根拠なく除外している。"]], "code": "", "answer": "A", "number": 15, "id": "M2-15"}, {"exam": 2, "k": "K18", "stem": "C9の9:00は1000、10:00はNULL。「正常値を抽出してから最新」を選ぶ処理は何を返すか。", "options": [["必ずNULLが残る", "処理順序を逆に解釈している。"], ["必ず0になる", "0置換を行う処理は指定されていない。"], ["1000が残る", "NULLの最新行を先に落としたため古い正常行を採用 <script>
'use strict';
const {questions,topics}=JSON.parse(document.querySelector('#bank').textContent);
const $=id=>document.getElementById(id), key='dp700-dojo-v1';
let history={};try{history=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
let queue=[],i=0,pick=-1,locked=false,results=[];
const topic=q=>topics[q.k];
function node(tag,value,cls){const n=document.createElement(tag);n.textContent=value;if(cls)n.className=cls;return n}
for(const d of new Set(questions.map(q=>topic(q).domain))){const o=node('option',d);o.value=d;$('domain').append(o)}
function show(id){for(const s of ['setup','quiz','result'])$(s).hidden=s!==id}
function home(){show('setup');$('stats').textContent='回答済み '+questions.filter(q=>history[q.id]).length+' / 90問　・　要復習 '+questions.filter(q=>history[q.id]==='wrong').length+'問';$('notice').textContent=''}
function begin(list){queue=list;i=0;results=[];show('quiz');render()}
$('start').onclick=()=>{const m=$('mode').value,d=$('domain').value,c=$('count').value;let list=questions.filter(q=>(!d||topic(q).domain===d)&&(m==='all'||(m==='new'?!history[q.id]:m==='wrong'?history[q.id]==='wrong':String(q.exam)===m)));if($('shuffle').checked)for(let j=list.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[list[j],list[k]]=[list[k],list[j]]}if(c!=='all')list=list.slice(0,Number(c));if(list.length)begin(list);else $('notice').textContent='この条件に該当する問題はありません。範囲または分野を変えてください。'};
function render(){const q=queue[i];pick=-1;locked=false;$('pos').textContent=(i+1)+' / '+queue.length+' 問 · '+q.id+' · '+topic(q).domain;$('progress').max=queue.length;$('progress').value=i;$('stem').textContent=q.stem;$('code').textContent=q.code||'';$('code').hidden=!q.code;$('feedback').hidden=true;$('feedback').replaceChildren();$('next').hidden=true;$('check').hidden=false;$('check').disabled=true;$('choices').replaceChildren();
q.options.forEach(([label],j)=>{const b=node('button','ABCD'[j]+'. '+label,'choice');b.setAttribute('aria-pressed','false');b.onclick=()=>{if(locked)return;pick=j;for(const [k,el] of Array.from($('choices').children).entries())el.setAttribute('aria-pressed',String(k===j));$('check').disabled=false};$('choices').append(b)});$('stem').focus()}
$('check').onclick=()=>{if(locked||pick<0)return;locked=true;const q=queue[i],right='ABCD'.indexOf(q.answer),correct=right===pick;results.push({q,correct});history[q.id]=correct?'right':'wrong';try{localStorage.setItem(key,JSON.stringify(history))}catch{}
for(const [j,b] of Array.from($('choices').children).entries()){b.disabled=true;if(j===right)b.classList.add('right');else if(j===pick)b.classList.add('wrong')}
const f=$('feedback');f.append(node('h3',(correct?'正解':'不正解')+' · 正解は '+q.answer));const ul=node('ul','');q.options.forEach(([label,reason],j)=>ul.append(node('li','ABCD'[j]+'. '+label+' — '+reason)));f.append(ul);const a=node('a',topic(q).title+'（PDF '+topic(q).page+'ページ）');a.href='DP700_Visual_Guide_JA.pdf#page='+topic(q).page;a.target='_blank';a.rel='noopener';f.append(a);f.hidden=false;$('progress').value=i+1;$('check').hidden=true;$('next').hidden=false;$('next').textContent=i+1===queue.length?'結果を見る':'次の問題';$('next').focus()};
$('next').onclick=()=>{if(!locked)return;if(++i<queue.length)render();else{show('result');const n=results.filter(r=>r.correct).length;$('score').textContent=n+' / '+results.length+'問正解（'+Math.round(100*n/results.length)+'%）';$('bydomain').replaceChildren();for(const d of new Set(results.map(r=>topic(r.q).domain))){const rows=results.filter(r=>topic(r.q).domain===d);$('bydomain').append(node('p',d+'　'+rows.filter(r=>r.correct).length+' / '+rows.length))}$('retry').disabled=n===results.length;$('result').querySelector('h2').focus()}};
$('retry').onclick=()=>{const list=results.filter(r=>!r.correct).map(r=>r.q);if(list.length)begin(list)};$('quit').onclick=$('back').onclick=home;home();
</script></html>
